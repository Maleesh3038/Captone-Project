<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectFlow - Task Manager</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="logo-text">ProjectFlow</span>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active">Dashboard</li>
                    <li>My Tasks</li>
                    <li>Projects</li>
                </ul>
            </nav>
        </aside>

        <main class="content-area">
            <header class="top-bar">
                <h1>My Dashboard</h1>
                <button id="openModalBtn" class="primary-btn">+ Add Task</button>
            </header>

            <section class="stat-row">
                <div class="stat-card">
                    <label>Total Tasks</label>
                    <h2 id="total-count">0</h2>
                </div>
                <div class="stat-card">
                    <label>In Progress</label>
                    <h2 id="progress-count">0</h2>
                </div>
                <div class="stat-card">
                    <label>Completed</label>
                    <h2 id="completed-count">0</h2>
                </div>
            </section>

            <section class="board">
                <div class="board-column">
                    <h3>To Do</h3>
                    <div class="task-list" id="todo-list"></div>
                </div>
                <div class="board-column">
                    <h3>In Progress</h3>
                    <div class="task-list" id="inprogress-list"></div>
                </div>
                <div class="board-column">
                    <h3>Done</h3>
                    <div class="task-list" id="done-list"></div>
                </div>
            </section>
        </main>
    </div>

    <div id="taskModal" class="modal-overlay">
        <div class="modal-box">
            <h3>Add New Task</h3>
            <form id="taskForm">
                <input type="text" id="taskTitle" placeholder="Task Name" required>
                <textarea id="taskDesc" placeholder="Task Description..."></textarea>
                <select id="taskStatus">
                    <option value="todo">To Do</option>
                    <option value="inprogress">In Progress</option>
                    <option value="done">Done</option>
                </select>
                <div class="form-actions">
                    <button type="button" id="closeModalBtn" class="btn-secondary">Cancel</button>
                    <button type="submit" class="btn-primary">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
